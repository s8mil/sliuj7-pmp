name: Build Windows Executable

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller numpy pandas matplotlib python-dateutil geopy

      - name: Build executable
        run: |
          pyinstaller --clean --onefile --name solar_pump --icon=assets/logo.ico --hidden-import=dateutil.relativedelta src/solar_pump/__main__.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: solar_pump-windows
          path: dist/solar_pump.exe
